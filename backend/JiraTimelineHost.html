<!doctype html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #212121; }
    iframe { width: 100%; height: 100%; border: 0; display: block; background: #212121; }
    .fallback { position: fixed; inset: 0; display: grid; place-items: center; color: #d7dfdc; font: 700 14px Arial, sans-serif; }
  </style>
</head>
<body>
  <div class="fallback" id="fallback">IT전략실 통합 일정 화면을 불러오는 중입니다.</div>
  <iframe
    id="timelineFrame"
    title="IT전략실 통합 일정"
    src="https://hikary83.github.io/kic-worktools/jira-timeline.html?embedded=1"
  ></iframe>

  <script>
    const FRAME_ORIGIN = 'https://hikary83.github.io';
    const frame = document.getElementById('timelineFrame');
    const fallback = document.getElementById('fallback');

    frame.addEventListener('load', () => { fallback.style.display = 'none'; });

    window.addEventListener('message', event => {
      const message = event.data || {};
      if (event.origin !== FRAME_ORIGIN || event.source !== frame.contentWindow) return;
      if (message.type !== 'KIC_JIRA_TIMELINE_REQUEST' || !message.requestId) return;

      google.script.run
        .withSuccessHandler(data => {
          frame.contentWindow.postMessage({
            type: 'KIC_JIRA_TIMELINE_RESPONSE',
            requestId: message.requestId,
            success: true,
            data: data
          }, FRAME_ORIGIN);
        })
        .withFailureHandler(error => {
          frame.contentWindow.postMessage({
            type: 'KIC_JIRA_TIMELINE_RESPONSE',
            requestId: message.requestId,
            success: false,
            error: error && error.message ? error.message : String(error)
          }, FRAME_ORIGIN);
        })
        .getJiraTimelineIssuesForWeb();
    });
  </script>
</body>
</html>
